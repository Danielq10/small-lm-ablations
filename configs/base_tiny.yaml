experiment: smoke-tests
run_name: baseline-fast
description: "Smaller model for quick test runs with 8k BPE tokenizer"
seed: 1337

model:
  n_embed: 256
  n_blocks: 2
  n_heads: 2
  n_groups: 2
  ffn: "mlp"
  dropout: 0.2
  block_size: 128
  pos_encoding: "learned"

train:
  batch_size: 64
  learning_rate: 3e-4
