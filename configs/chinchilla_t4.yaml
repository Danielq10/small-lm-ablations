experiment: arch-ablation
run_name: chinchilla-t4-baseline
description: "Compute-optimal ~9M baseline model (~4.7M backbone, 8k BPE) on 92M Polish tokens"
seed: 1337

model:
  n_embed: 256
  n_blocks: 6
  n_heads: 4
  dropout: 0.2
  block_size: 1024

train:
  batch_size: 64
  learning_rate: 5e-4
  training_steps: 6000

eval:
  eval_iters: 100
  eval_interval: 500
