experiment: arch-ablation-final
run_name: gqa
description: "Phase 1 single-swap: Grouped-Query Attention (2 KV groups) + learned pos encoding + MLP"
seed: 1337

model:
  n_embed: 512
  n_blocks: 6
  n_heads: 8
  n_groups: 2
  ffn: "mlp"
  dropout: 0.0
  block_size: 256
  pos_encoding: "learned"

train:
  batch_size: 128
  learning_rate: 6e-4
