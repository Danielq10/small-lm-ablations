[project]
name = "small-lm-ablations"
version = "0.1.0"
description = "A project for building and training mini tranformer from scratch, experimenting with model ablations"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.1.0",
    "ipykernel>=7.3.0",
    "mlflow>=3.16.1",
    "numpy>=2.5.3",
    "nvidia-ml-py>=13.615.71",
    "psutil>=7.2.2",
    "tokenizers>=0.23.2",
    "torch==2.14.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
